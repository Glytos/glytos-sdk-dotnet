name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The tag only triggers this workflow; the version comes from the csproj.
      # Forgetting to bump it therefore packs the version that is already on
      # NuGet, and `--skip-duplicate` below turns that into a green run that
      # published nothing. Fail here instead, while it is still obvious why.
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          status=0
          for project in \
            src/Glytos/Glytos.csproj \
            src/Glytos.Extensions.DependencyInjection/Glytos.Extensions.DependencyInjection.csproj
          do
            actual=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$project" | head -1)
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$project::version is $actual but the tag is $expected"
              status=1
            fi
          done
          exit $status

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Trusted Publishing: exchanges the workflow's OIDC token for a short-lived
      # NuGet key, so no long-lived API key is ever stored. `user` is the NuGet
      # account the trusted publishing policy is registered under.
      - name: Authenticate to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: baranyalcin

      - name: Pack
        run: dotnet pack -c Release -o "${{ runner.temp }}/nupkgs"

      - name: Push
        run: >
          dotnet nuget push "${{ runner.temp }}/nupkgs/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
